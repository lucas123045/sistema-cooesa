# Backup semanal do banco (o plano gratuito do Supabase não guarda backups).
# Gera um pg_dump em formato custom e guarda como artefato do workflow por 90 dias.
# Requer o secret SUPABASE_DB_URL (Settings → Secrets and variables → Actions).
# Restauração: ver README, seção "Backup e restauração".
name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * 0" # domingo, 03:00 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Gerar dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurado."
            exit 1
          fi
          ARQUIVO="cooesa-$(date -u +%Y-%m-%d).dump"
          # public = dados do sistema; auth = usuários e senhas (hash); storage = anexos (fase futura)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="$ARQUIVO"
          ls -lh "$ARQUIVO"
          echo "ARQUIVO=$ARQUIVO" >> "$GITHUB_ENV"

      - name: Guardar como artefato (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}
          retention-days: 90
          if-no-files-found: error
