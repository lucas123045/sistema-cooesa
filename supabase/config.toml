# Configuração do Supabase CLI (ambiente local e vínculo com o projeto remoto).
# O projeto remoto fica na região São Paulo (sa-east-1), plano gratuito.
# Documentação: https://supabase.com/docs/guides/local-development/cli/config

project_id = "sistema-cooesa"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirmar"]
jwt_expiry = 3600
# Sem cadastro público: contas são criadas só pelo admin.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
